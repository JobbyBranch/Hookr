name: Daily metrics snapshot

on:
  schedule:
    - cron: "17 3 * * *"   # once a day, 03:17 UTC
  workflow_dispatch:        # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch metrics and append to data/history.json
        run: node scripts/snapshot.mjs
      - name: Commit snapshot
        run: |
          git config user.name "metrics-snapshot"
          git config user.email "actions@users.noreply.github.com"
          git add data/history.json
          git diff --cached --quiet || git commit -m "Metrics snapshot $(date -u +%F)"
          git push
